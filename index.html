<!DOCTYPE html>
<html lang="en" data-lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ameyali Foundation — Back soon</title>
<meta name="robots" content="noindex">
<meta name="description" content="The Ameyali Foundation website is temporarily offline for maintenance. We'll be back shortly.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,300..800,50..100&family=DM+Sans:opsz,wght@9..40,300..700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2A1D12;
  --saddle:#5A3D24;
  --cream:#F5EDDC;
  --sand:#E5D5B7;
  --grass:#5C7548;
  --gold:#FBC647;
  --rule:rgba(42,29,18,.14);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'DM Sans', system-ui, -apple-system, sans-serif;
  color:var(--ink);
  background:
    radial-gradient(1200px 600px at 50% -10%, #FBF4E4, transparent 60%),
    var(--cream);
  display:flex;align-items:center;justify-content:center;
  min-height:100vh;padding:2rem;text-align:center;
  -webkit-font-smoothing:antialiased;
}
.card{max-width:34rem}
.eyebrow{
  font-family:'Fraunces', Georgia, serif;
  font-size:.78rem;letter-spacing:.22em;text-transform:uppercase;
  color:var(--saddle);margin-bottom:1.25rem;
}
h1{
  font-family:'Fraunces', Georgia, serif;
  font-variation-settings:'opsz' 144, 'SOFT' 60, 'wght' 420;
  font-weight:420;letter-spacing:-0.02em;line-height:1.05;
  font-size:clamp(2.1rem, 1.6rem + 3vw, 3.4rem);
  margin-bottom:1.1rem;
}
p{
  font-size:clamp(1.02rem, 1rem + .3vw, 1.15rem);
  line-height:1.6;color:var(--saddle);max-width:40ch;margin:0 auto;
}
.rule{
  width:64px;height:4px;border-radius:2px;margin:1.75rem auto;
  background:linear-gradient(90deg, var(--grass), var(--gold));
}
.contact{margin-top:2rem;font-size:.95rem;color:var(--saddle)}
.contact a{color:var(--grass);text-decoration:none;border-bottom:1px solid var(--rule)}
.contact a:hover{border-bottom-color:var(--grass)}
</style>
</head>
<body>
  <main class="card">
    <div class="eyebrow">Ameyali Foundation</div>
    <h1>We&rsquo;ll be back soon</h1>
    <div class="rule" aria-hidden="true"></div>
    <p>Our website is temporarily offline for maintenance. Thank you for your patience &mdash; please check back shortly.</p>
    <p class="contact">In the meantime, reach us at <a href="mailto:Ameyaliescaramuza@gmail.com">Ameyaliescaramuza@gmail.com</a></p>
  </main>
</body>
</html>
